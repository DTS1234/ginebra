# Fly.io deployment. `fly launch --no-deploy` then `fly deploy`.
#
# One machine, no autoscaling, no rolling restarts: games live in memory, so a
# second instance would not see the first one's tables and a restart drops them.
# Revisit once Phase 5 lands persistence.

app = "ginebra"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
