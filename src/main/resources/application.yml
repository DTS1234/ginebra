server:
  # Hosting platforms hand the port in through $PORT; locally it is just 8080.
  port: ${PORT:8080}
  # Let in-flight requests finish when the platform sends SIGTERM on a redeploy.
  # Games still die with the process - they are in memory until Phase 5 - but a
  # player mid-request gets an answer rather than a dropped connection.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: ginebra-online

ginebra:
  bots:
    # How long a bot waits before each move. Not for the bot's benefit - it decides
    # instantly - but so a person can watch the cards land one at a time. Zero makes a
    # basa resolve inside their own click.
    move-delay: 800ms
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-use-long-random-string-minimum-256-bits}
    expiration-hours: 24
    issuer: ginebra-online
